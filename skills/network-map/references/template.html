<!doctype html><html><head><meta charset="utf-8"><title>Network map</title>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--line:#1e293b;--mut:#94a3b8;--txt:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13.5px/1.45 -apple-system,Segoe UI,Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 22px 8px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}h1{margin:0;font-size:19px;font-weight:600}.sub{color:var(--mut);font-size:12px}
.scorebar{display:flex;gap:16px;align-items:baseline}.scorebar .big{font-size:22px;font-weight:600;line-height:1}.scorebar .lbl{color:var(--mut);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.tg{border:1px solid #334155;background:#0f172a;color:#cbd5e1;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}.tg.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
#trend{display:none;border-top:1px solid var(--line);background:#0b1220;padding:8px 22px 6px;flex:none;position:relative}#trend.on{display:block}
#trend svg{width:100%;height:132px;display:block}.tleg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-bottom:2px}.tleg i{display:inline-block;width:14px;height:3px;margin:0 5px 2px 0;border-radius:2px}
.tcap{color:#94a3b8;font-size:11px;margin-top:4px}#ttip{position:absolute;display:none;background:#0b1220ee;border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;z-index:5;max-width:320px}#ttip.on{display:block}#trend .dot{cursor:pointer}
.wrap{display:grid;grid-template-columns:1fr 480px;gap:0;flex:1;min-height:0}
.topo{position:relative;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden;cursor:grab}.topo:active{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:8px;color:var(--mut);font-size:11px;pointer-events:none}.legend span{margin-right:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2.5px solid;margin:0 4px -1px 0}
.side{overflow-y:auto;padding:12px 14px;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}h3{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:8px}h3 small{font-weight:400;text-transform:none;letter-spacing:0}
.card.lead h3{color:#f8fafc;font-size:14px}
details.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}details.card>summary::-webkit-details-marker{display:none}
details.card>summary:before{content:"▸";color:#64748b;margin-right:8px}details.card[open]>summary:before{content:"▾"}
details.card .body{padding:0 14px 12px}.pct{font-size:22px;font-weight:600;color:#f8fafc;line-height:1;white-space:nowrap}
.fine{color:var(--mut);font-size:11.5px;margin-top:3px}.fine a{color:#60a5fa}.empty{color:#64748b;font-style:italic}
.item{margin:5px 0;padding:6px 8px;background:var(--bg);border-radius:8px;font-size:12.5px;cursor:pointer;border:1px solid transparent}.item:hover{border-color:#334155}.item.sel{border-color:#60a5fa}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;color:#0b1220;font-size:10px;font-weight:700;text-transform:uppercase;margin-right:6px}
.keys{color:#7dd3fc;font-size:11px}.hyp{color:#cbd5e1;margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:12px}td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.scores{display:flex;gap:22px;margin:4px 0 6px}.big{font-size:26px;font-weight:600}
.chip{display:inline-block;background:#1e293b;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:11.5px;color:#cbd5e1;cursor:pointer}.chip.on{background:#4c1d95}
#drawer{position:absolute;right:12px;top:12px;width:360px;max-height:calc(100% - 60px);overflow:auto;background:#0b1220ee;border:1px solid #334155;border-radius:12px;padding:12px 14px;display:none;font-size:12.5px}#drawer.open{display:block}#drawer h2{margin:0 0 4px;font-size:15px}#drawer .x{float:right;cursor:pointer;color:var(--mut)}
.tier{cursor:pointer}.tier:hover td{background:#111c33}
.site{fill:#64748b;font-size:11px;letter-spacing:.04em}.nl{fill:#e2e8f0;font-size:11px;pointer-events:none}.bd{fill:#0b1220;font-size:10px;font-weight:700;pointer-events:none}
.node{cursor:pointer}.node.dim{opacity:.18}.lk.dim{opacity:.08}.fl.dim{opacity:.05}.lk.hi{stroke:#f8fafc!important;stroke-width:3.5!important}.fl.hi{stroke:#c4b5fd!important;stroke-width:3!important;opacity:1!important}
.node.hi circle.body{stroke-width:5;filter:drop-shadow(0 0 6px #fff8)}
footer{padding:4px 22px;border-top:1px solid var(--line);color:#64748b;font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
</style></head><body>
<header><h1 id="title">Network map</h1><div class="scorebar" id="scorebar"></div><div class="sub" id="sub"></div>
<div class="toggles"><span class="tg" id="trendTg">Trend</span><span class="tg on" data-l="flows">NetFlow flows</span><span class="tg on" data-l="mgmt">OOB mgmt</span><span class="tg on" data-l="comp">Compliance</span><span class="tg on" data-l="tick">Incidents</span><span class="tg on" data-l="probs">Problems</span><span class="tg" data-l="peers">BGP peers</span><span class="tg" id="reset">Reset</span></div></header>
<div id="trend"></div>
<div class="wrap"><div class="topo" id="topo"><svg id="svg"><defs><marker id="pa" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#a78bfa"/></marker></defs><g id="view"></g></svg>
<div class="legend"><span><i style="border-color:#3b82f6"></i>IOS-XE</span><span><i style="border-color:#06b6d4"></i>NX-OS</span><span><i style="border-color:#f97316"></i>ASA</span><span><i style="border-color:#64748b"></i>L2 switch</span><span><i style="border-color:#a3e635"></i>Linux host</span><span style="color:#ef4444">&#9711; active problem</span><span style="color:#f59e0b">&#9711; watching</span><span><b style="background:#f59e0b;color:#0b1220;padding:0 4px;border-radius:3px">C</b> compliance FAIL</span><span><b style="background:#ec4899;color:#0b1220;padding:0 4px;border-radius:3px">I</b> incident</span><span style="color:#a78bfa">&#10230; flows_to</span><span style="color:#fbbf24">&mdash; peers_with</span> &middot; click a device &middot; scroll to zoom &middot; drag to pan</div>
<div id="drawer"></div></div>
<div class="side" id="side"></div></div>
<footer id="foot"></footer>
<script>const D=__DATA__;</script>
<script>
const C={iosxe:'#3b82f6',l2:'#64748b',nxos:'#06b6d4',asa:'#f97316',linux:'#a3e635'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ts=s=>s?String(s).slice(0,16).replace('T',' ')+'Z':'—';
const EMPTY='<div class="empty">no board in the workspace</div>';
document.getElementById('title').textContent=`${D.lab} — topology · application · health · compliance · relationships`;
const tpScore=(D.compliance.scores||{}).tested_posture;
const pctLabel=n=>n==null||n===''?'—':`${Number(n).toFixed(0)}%`;
document.getElementById('scorebar').innerHTML=`<div><div class="big">${pctLabel(tpScore&&tpScore.percent)}</div><div class="lbl">compliant</div></div><div><div class="big">${pctLabel(D.health.score)}</div><div class="lbl">health${D.health.status?' · '+esc(D.health.status):''}</div></div>`;
document.getElementById('sub').textContent=`generated ${ts(D.generated)} · inventory ${ts(D.sync.collected_at)} · health ${ts(D.health.updated_at)} · relationships ${ts(D.rel_updated)} · compliance ${ts(D.compliance.test_updated||D.compliance.updated_at)}`;
document.getElementById('foot').innerHTML=`<span>layout: ${esc(D.layout)}</span><span>links: ${esc(D.link_source)}</span>`+Object.entries(D.sources).map(([k,v])=>`<span>${esc(k)} ${ts(v)}</span>`).join('')+(D.missing.length?`<span style="color:#f59e0b">missing: ${D.missing.map(esc).join(', ')}</span>`:'');
// ---- layout
const xs=D.nodes.map(n=>n.x),ys=D.nodes.map(n=>n.y);const mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);
const sx=(Mx-mx)||1,sy=(My-my)||1;const pad=70,W=Math.max(1100,Math.min(1500,sx*0.9+2*pad)),H=Math.max(700,Math.round((W-2*pad)*sy/sx)+2*pad+40);
const pos={};D.nodes.forEach(n=>pos[n.label]=[pad+(n.x-mx)*(W-2*pad)/sx,pad+(n.y-my)*(H-2*pad-40)/sy]);
const byName={};D.nodes.forEach(n=>byName[n.label]=n);
// ---- derived state
const probsOf={},tickOf={};D.health.problems.forEach(p=>{if(p.status==='resolved')return;(p.keys||[]).forEach(k=>{if(k.startsWith('device:')){(probsOf[k.slice(7)]??=[]).push(p);(p.keys||[]).filter(x=>x.startsWith('incident:')).map(x=>x.slice(9)).forEach(i=>(tickOf[k.slice(7)]??=new Set()).add(i));}})});
const failDev=new Set(D.compliance.failing_devices),scanned=new Set(D.compliance.scanned_devices);
const cur=e=>e.status!=='retired';
const flows=D.edges.filter(e=>e.rel==='flows_to'&&cur(e)&&e.from.startsWith('device:')&&e.to.startsWith('device:')).map(e=>[e.from.slice(7),e.to.slice(7)]);
const peers=D.edges.filter(e=>e.rel==='peers_with'&&cur(e)&&e.from.startsWith('device:')&&e.to.startsWith('device:')).map(e=>[e.from.slice(7),e.to.slice(7)]);
const hostSvc={};D.app.services.forEach((s,i)=>{if(s.host_node)hostSvc[s.host_node]=i});
const layers={flows:true,mgmt:true,comp:true,tick:true,probs:true,peers:false};
// ---- render topology
const view=document.getElementById('view');
function render(){let s='';const sites={};D.nodes.forEach(n=>{if(n.site)(sites[n.site]??=[]).push(pos[n.label])});
for(const[st,pts]of Object.entries(sites)){const x0=Math.min(...pts.map(p=>p[0]))-40,x1=Math.max(...pts.map(p=>p[0]))+40,y0=Math.min(...pts.map(p=>p[1]))-34,y1=Math.max(...pts.map(p=>p[1]))+40;s+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="16" fill="#ffffff06" stroke="#334155" stroke-dasharray="4,4"/><text x="${x0+10}" y="${y0+16}" class="site">site:${esc(st)}</text>`}
D.links.forEach(l=>{const[a,b]=[pos[l.a],pos[l.b]];if(!a||!b)return;const m=l.mgmt;if(m&&!layers.mgmt)return;s+=`<line class="lk" data-a="${esc(l.a)}" data-b="${esc(l.b)}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${m?'#1e293b':'#475569'}" stroke-width="${m?1:2}" ${m?'stroke-dasharray="3,5"':''}><title>${esc(l.a)} ${esc(l.ai)} — ${esc(l.b)} ${esc(l.bi)}${m?' (OOB mgmt)':''}</title></line>`});
if(layers.peers)peers.forEach(([a,b])=>{if(!pos[a]||!pos[b])return;const[p,q]=[pos[a],pos[b]];s+=`<line class="fl pr" data-a="${esc(a)}" data-b="${esc(b)}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="2,4" opacity=".8"><title>BGP: ${esc(a)} peers_with ${esc(b)}</title></line>`});
if(layers.flows)flows.forEach(([a,b])=>{if(!pos[a]||!pos[b])return;const[p,q]=[pos[a],pos[b]];const cx=(p[0]+q[0])/2+(q[1]-p[1])*.25,cy=(p[1]+q[1])/2-(q[0]-p[0])*.25;s+=`<path class="fl" data-a="${esc(a)}" data-b="${esc(b)}" d="M${p[0]},${p[1]} Q${cx},${cy} ${q[0]},${q[1]}" fill="none" stroke="#a78bfa" stroke-width="1.6" opacity=".7" marker-end="url(#pa)"><title>NetFlow: ${esc(a)} flows_to ${esc(b)}</title></path>`});
D.nodes.forEach(n=>{const[x,y]=pos[n.label],nm=n.label,col=C[n.platform]||'#94a3b8',r=n.platform==='iosxe'?18:14;let g=`<g class="node" data-n="${esc(nm)}">`;
if(layers.probs&&probsOf[nm]){const act=probsOf[nm].some(p=>p.status==='active');g+=`<circle cx="${x}" cy="${y}" r="${r+7}" fill="none" stroke="${act?'#ef4444':'#f59e0b'}" stroke-width="3"/>`}
g+=`<circle class="body" cx="${x}" cy="${y}" r="${r}" fill="#0f172a" stroke="${col}" stroke-width="3" ${n.access?'':'stroke-dasharray="4,3"'}/>`;
if(layers.comp&&failDev.has(nm))g+=`<rect x="${x+r-4}" y="${y-r-10}" width="14" height="14" rx="3" fill="#f59e0b"/><text x="${x+r+3}" y="${y-r+1}" class="bd" text-anchor="middle">C</text>`;
if(layers.tick&&tickOf[nm])g+=`<rect x="${x-r-10}" y="${y-r-10}" width="14" height="14" rx="3" fill="#ec4899"/><text x="${x-r-3}" y="${y-r+1}" class="bd" text-anchor="middle">I</text>`;
if(hostSvc[nm]!==undefined){const sv=D.app.services[hostSvc[nm]];const nc=sv.tiers.reduce((a,t)=>a+t.containers.length,0);g+=`<text x="${x}" y="${y-r-14}" class="nl" style="fill:#a3e635" text-anchor="middle">${esc(sv.service)} · ${nc} containers</text>`}
g+=`<text x="${x}" y="${y+r+14}" class="nl" text-anchor="middle">${esc(nm)}</text></g>`;s+=g});
view.innerHTML=s;view.querySelectorAll('.node').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();select(el.dataset.n)}));applyFocus()}
// ---- focus / highlight
let focus=null;
function applyFocus(){const on=!!focus;view.querySelectorAll('.node').forEach(el=>{const h=on&&focus.nodes.has(el.dataset.n);el.classList.toggle('dim',on&&!h);el.classList.toggle('hi',h&&focus.primary===el.dataset.n)});view.querySelectorAll('.lk,.fl').forEach(el=>{const h=on&&focus.nodes.has(el.dataset.a)&&focus.nodes.has(el.dataset.b);el.classList.toggle('dim',on&&!h);el.classList.toggle('hi',h)})}
function focusNodes(list,primary){focus={nodes:new Set(list.filter(n=>pos[n])),primary};applyFocus()}
function clearFocus(){focus=null;applyFocus();drawer.classList.remove('open');document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));document.querySelectorAll('.chip.on').forEach(e=>e.classList.remove('on'))}
const drawer=document.getElementById('drawer');
const pillc=s=>s==='active'||s==='high'?'#ef4444':s==='watching'||s==='medium'?'#f59e0b':s==='resolved'?'#22c55e':'#64748b';
const fpill=f=>f.status==='remediated'?`<span class="pill" style="background:#22c55e">fixed</span>`:f.status==='regressed'?`<span class="pill" style="background:#ef4444">regressed</span>`:`<span class="pill" style="background:${pillc(f.severity)}">${f.severity}</span>`;
function select(nm){const n=byName[nm];if(!n)return;const nb=new Set([nm]);D.links.forEach(l=>{if(l.a===nm)nb.add(l.b);if(l.b===nm)nb.add(l.a)});flows.forEach(([a,b])=>{if(a===nm)nb.add(b);if(b===nm)nb.add(a)});focusNodes([...nb],nm);
const sl=D.syslog[nm];const ps=probsOf[nm]||[];const ifs=D.links.filter(l=>l.a===nm||l.b===nm).map(l=>l.a===nm?`${l.ai} → ${l.b} ${l.bi}`:`${l.bi} → ${l.a} ${l.ai}`);
const ed=D.edges.filter(e=>e.from===`device:${nm}`||e.to===`device:${nm}`||e.from.startsWith(`interface:${nm}/`)||e.to.startsWith(`interface:${nm}/`));
const cf=D.compliance.findings.filter(f=>(f.keys||[]).includes(`device:${nm}`));const no=D.netops.review.filter(r=>(r.devices||[]).includes(nm));const hh=D.app.hosts[nm];
let h=`<span class="x" onclick="clearFocus()">✕</span><h2>${esc(nm)}</h2><div class="fine">${esc(n.platform)} · ${esc(n.role)} · ${esc(n.site||'no site')} · ${n.access?'reachable':'no agent access'} ${n.tags.filter(t=>t.startsWith('test:')||t.startsWith('tag:')).map(esc).join(' ')}</div>`;
if(hh){const cs=containersOn(nm);h+=`<p><b>Host</b> · ${esc(hh.instance||'')} · ${esc(hh.state||'')} · mem avail ${hh.mem??'?'}% · fs ${hh.fs??'?'}% · up ${age(hh.boot)}${(hh.ifdown||[]).length?` · down ${hh.ifdown.map(esc).join(', ')}`:''}`;if(cs.length)h+=`<br><b>Containers</b><br>`+cs.map(crow).join('<br>');h+=`</p>`}
if(ps.length)h+=`<p><b>Chart problems</b>`+ps.map(p=>`<div class="item" onclick="selProblem('${p.id}')"><span class="pill" style="background:${pillc(p.status)}">${p.status}</span><b>${p.id}</b><div class="hyp">${esc(p.hypothesis)}</div></div>`).join('')+`</p>`;
if(cf.length)h+=`<p><b>Compliance</b>`+cf.map(f=>`<div class="item">${fpill(f)}${esc(f.summary)} <span class="keys">${(f.keys||[]).filter(k=>k.startsWith('control:')).map(esc).join(' ')}</span></div>`).join('')+`</p>`;else if(scanned.size&&!scanned.has(nm))h+=`<p><b>Compliance</b><div class="fine">not in the last test run scope</div></p>`;
if(no.length)h+=`<p><b>Network Ops review</b>`+no.map(r=>`<div class="item">${esc(r.finding)}${r.proposed?`<div class="fine">proposed: ${esc(typeof r.proposed==='string'?r.proposed:JSON.stringify(r.proposed))}</div>`:''}</div>`).join('')+`</p>`;
if(sl)h+=`<p><b>Syslog</b> <span class="fine">${Object.entries(sl).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</span></p>`;
if(tickOf[nm])h+=`<p><b>Incidents</b> ${[...tickOf[nm]].map(esc).join(', ')}</p>`;
h+=`<p><b>Links</b> (${ifs.length})<div class="fine">${ifs.map(esc).join('<br>')||'none in inventory'}</div></p>`;
if(ed.length)h+=`<p><b>Compiled edges</b> (${ed.length})<div class="fine">${ed.map(e=>`${esc(e.from)} <i>${e.rel}</i> ${esc(e.to)} <span style="color:#64748b">${e.basis}</span>`).join('<br>')}</div></p>`;
drawer.innerHTML=h;drawer.classList.add('open')}
function age(ep){if(!ep)return'?';const h=Math.floor((Date.now()/1000-ep)/3600);return h>=24?`${Math.floor(h/24)}d ${h%24}h`:`${h}h`}
function rate(n){if(n==null)return'?';if(n>=1048576)return`${(n/1048576).toFixed(1)} MiB/s`;if(n>=1024)return`${(n/1024).toFixed(1)} KiB/s`;return`${n} B/s`}
function containersOn(nm){const out=[];D.app.services.forEach(sv=>sv.tiers.forEach(t=>(t.containers||[]).forEach(c=>{if(c.device===nm||c.host===nm)out.push(c)})));return out}
function crow(c){return`${esc(c.name||'?')} <span class="fine">${esc(c.image||'')}</span> ${esc(c.state||'')} · cpu ${c.cpu??'?'}% · ${c.mem??'?'} MiB · rx ${rate(c.rx)} · up ${age(c.start)}`}
function selProblem(id){const p=D.health.problems.find(x=>x.id===id);if(!p)return;const devs=(p.keys||[]).filter(k=>k.startsWith('device:')||k.startsWith('interface:')).map(k=>k.split(':')[1].split('/')[0]);const im=p.impact||{};(im.hosts||[]).forEach(x=>devs.push(x));focusNodes(devs,null);
drawer.innerHTML=`<span class="x" onclick="clearFocus()">✕</span><h2>${p.id} <span class="pill" style="background:${pillc(p.status)}">${p.status}</span></h2><div class="keys">${(p.keys||[]).map(esc).join(' ')}</div><p>${esc(p.hypothesis)}</p>${p.impact?`<div class="fine">impact — applications: ${(im.applications||[]).map(esc).join(', ')||'none'} · services: ${(im.services||[]).map(esc).join(', ')||'none'} · hosts: ${(im.hosts||[]).map(esc).join(', ')||'none'} (${esc(im.basis||'')})</div>`:''}${p.order?`<div class="fine">order → ${esc(p.order.agent)}: ${esc(p.order.task)}</div>`:''}<div class="fine">opened ${esc(p.opened_at)}</div>`;drawer.classList.add('open');mark(id)}
function selFinding(i){const f=D.compliance.findings[i];const devs=(f.keys||[]).filter(k=>k.startsWith('device:')).map(k=>k.slice(7));focusNodes(devs,null);drawer.innerHTML=`<span class="x" onclick="clearFocus()">✕</span><h2>Compliance finding <span class="pill" style="background:${pillc(f.severity)}">${f.severity}</span></h2><p>${esc(f.summary)}</p><div class="keys">${(f.keys||[]).filter(k=>!k.startsWith('device:')).map(esc).join(' ')}</div><div class="fine">${devs.length} devices · next owner ${esc(f.next_owner||'')}</div>`;drawer.classList.add('open');mark('f'+i)}
function selTier(si,tn){const sv=D.app.services[si];const t=sv.tiers.find(x=>x.name===tn);if(!t)return;focusNodes([...sv.path,...t.hosts],sv.host_node);
let h=`<span class="x" onclick="clearFocus()">✕</span><h2>application: ${esc(tn)}</h2><div class="fine">service ${esc(sv.service)}${t.depends_on.length?` · depends on ${t.depends_on.map(esc).join(', ')}`:''}${t.status?` · ${esc(t.status)}`:''}</div>`;
const pr=Object.entries(t.probes);h+=`<p><b>Probes</b>`+(pr.length?pr.map(([site,v])=>`<br><span class="dot" style="background:${v.up?'#22c55e':'#ef4444'}"></span>${esc(site)}: ${v.up?'UP':esc(v.state||'DOWN')} · HTTP ${esc(v.http??'?')} · ${v.ms??'?'} ms · ${esc(v.target||'')}`).join(''):'<div class="fine">no probe rows</div>')+`</p>`;
h+=`<p><b>Containers</b>`+(t.containers.length?t.containers.map(c=>`<br>${crow(c)} on ${esc(c.device||c.host||'?')}`).join(''):'<div class="fine">no container rows</div>')+`</p>`;
h+=`<p><b>Hosts</b> <span class="fine">${t.hosts.map(esc).join(', ')||'none mapped'}${t.hosts_unmapped.length?` · unmapped: ${t.hosts_unmapped.map(esc).join(', ')}`:''}</span></p>`;
h+=`<p><b>Path to the WAN</b><div class="fine">${sv.path.length>1?sv.path.map(esc).join(' → '):'no cabled path in inventory (links[] / connected_to)'}</div></p>`;
const onpath=sv.path.filter(n=>probsOf[n]||failDev.has(n));if(onpath.length)h+=`<p><b>Network state on that path</b>`+onpath.map(n=>`<div class="fine">${esc(n)}: ${probsOf[n]?probsOf[n].map(p=>p.id+' '+p.status).join(', '):''}${failDev.has(n)?' · compliance FAIL':''}</div>`).join('')+`</p>`;
drawer.innerHTML=h;drawer.classList.add('open');mark('t'+si+tn)}
function mark(id){document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(el)el.classList.add('sel')}
function selRel(rel){const ns=new Set();D.edges.filter(e=>e.rel===rel&&cur(e)).forEach(e=>[e.from,e.to].forEach(k=>{if(k.startsWith('device:'))ns.add(k.slice(7));if(k.startsWith('interface:'))ns.add(k.slice(10).split('/')[0]);if(k.startsWith('application:')||k.startsWith('service:'))D.app.services.forEach(s=>{if(s.host_node)ns.add(s.host_node)})}));focusNodes([...ns],null);document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.rel===rel));const ed=D.edges.filter(e=>e.rel===rel);drawer.innerHTML=`<span class="x" onclick="clearFocus()">✕</span><h2>${esc(rel)} <span class="fine">${ed.length} edges</span></h2><div class="fine">${ed.slice(0,40).map(e=>`${esc(e.from)} → ${esc(e.to)} <span style="color:#64748b">${e.basis}${e.status==='retired'?' retired':''}</span>`).join('<br>')}${ed.length>40?'<br>…':''}</div>`;drawer.classList.add('open')}
// ---- side panels
function card(title,summary,body,lead){return `<details class="card${lead?' lead':''}"><summary><h3>${title}</h3>${lead?`<div class="pct">${summary}</div>`:`<div class="fine">${summary}</div>`}</summary><div class="body">${body}</div></details>`}
function side(){const A=D.app,Hh=D.health,Cp=D.compliance,sc=Cp.scores||{},ct=Cp.counts||{};let s='';
let appBody='';
if(!A.services.length)appBody=EMPTY;
A.services.forEach((sv,si)=>{const hh=sv.host_node?A.hosts[sv.host_node]||{}:{};appBody+=`<div class="fine" style="margin-bottom:6px"><b>${esc(sv.service)}</b></div><table>`+sv.tiers.map(t=>{const pr=Object.entries(t.probes);const cs=t.containers||[];return `<tr class="tier" onclick="selTier(${si},'${esc(t.name)}')" data-id="t${si}${esc(t.name)}"><td><b>${esc(t.name)}</b></td><td>${pr.length?pr.map(([site,v])=>`<span class="dot" style="background:${v.up?'#22c55e':'#ef4444'}"></span>${esc(site)} ${esc(v.http??'')} · ${v.ms??'?'} ms`).join('<br>'):'<span class="empty">no probes</span>'}</td><td>${cs.length?cs.map(c=>`${esc(c.name)} on ${esc(c.host||c.device||'?')} ${esc(c.state||'')} · ${c.cpu??'?'}% · ${c.mem??'?'} MiB · rx ${rate(c.rx)}`).join('<br>'):'<span class="empty">no containers</span>'}</td></tr>`}).join('')+`</table><div class="fine">${sv.host_node?`host ${esc(sv.host_node)} mem avail ${hh.mem??'?'}% · up ${age(hh.boot)} · `:'<span style="color:#f59e0b">no host resolved to an inventory device</span> · '}path ${sv.path.length>1?sv.path.map(esc).join(' → '):'none'} · click a tier to trace it</div>`});
s+=card('Application Health',pctLabel(A.score),appBody,true);
const healthBody=Hh.present?Hh.problems.map(p=>`<div class="item" data-id="${p.id}" onclick="selProblem('${p.id}')"><span class="pill" style="background:${pillc(p.status)}">${p.status}</span><b>${p.id}</b> <span class="keys">${(p.keys||[]).filter(k=>k.startsWith('device:')||k.startsWith('incident:')).map(esc).join(' ')}</span><div class="hyp">${esc(p.hypothesis)}</div></div>`).join(''):EMPTY;
s+=card('Health',pctLabel(Hh.score),healthBody,true);
const tp=sc.tested_posture;
const sev={high:0,medium:1,low:2};
const issues=[...Cp.findings].filter(f=>f.status!=='remediated').sort((a,b)=>(sev[a.severity]??3)-(sev[b.severity]??3));
const worst=Cp.worst_devices||[];
const compBody=Cp.present?`<div class="fine">${worst.length?`${worst.length} devices with findings`:''}</div>`+(worst.length?worst.map(d=>`<div class="item" onclick="focusNodes(${esc(JSON.stringify([d.name]))},'${esc(d.name)}')"><b>${esc(d.name)}</b> <span class="fine">${d.findings} findings</span></div>`).join(''):'')+(issues.length?`<div class="fine" style="margin-top:8px">Critical issues</div>`:'')+issues.slice(0,8).map(f=>`<div class="item" data-id="f${Cp.findings.indexOf(f)}" onclick="selFinding(${Cp.findings.indexOf(f)})">${fpill(f)}${esc(f.summary)}</div>`).join(''):EMPTY;
s+=card('Compliance',pctLabel(tp&&tp.percent),compBody,true);
const cn={};D.edges.forEach(e=>{if(cur(e))cn[e.rel]=(cn[e.rel]||0)+1});
s+=card('Relationships',esc(D.rel_head||'no relationship board'),D.edges.length?`<div style="margin-top:6px">`+Object.entries(cn).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip" data-rel="${esc(k)}" onclick="selRel('${esc(k)}')">${esc(k)} <b>${v}</b></span>`).join('')+`</div><div class="fine">${D.drift.length?`${D.drift.length} drift rows · `:''}click a rel to light up every device it touches</div>`:EMPTY);
s+=card(`Network Ops${D.netops.mode?` · ${esc(D.netops.mode)}`:''}`,esc(D.netops.headline||'no review board'),D.netops.present?D.netops.review.map((r,i)=>`<div class="item" onclick="focusNodes(${esc(JSON.stringify(r.devices||[]))},null)">${r.rank||i+1}. <b>${(r.devices||[]).map(esc).join(', ')}</b> — ${esc(r.finding)}</div>`).join(''):EMPTY);
s+=card('ServiceNow · Inventory',esc(D.snow.headline||D.sync.headline||'no ticket or inventory board'),(D.snow.present?`<div class="fine">${esc(JSON.stringify(D.snow.open))} · ${ts(D.snow.updated_at)}</div>`:`<div class="empty">no ServiceNow board</div>`)+`<div class="fine" style="margin-top:6px">${esc(D.sync.headline||`${D.sync.device_count} devices`)} · inventory ${esc(D.sync.status||'')} ${ts(D.sync.collected_at)}</div>`);
document.getElementById('side').innerHTML=s}
function pointDetail(s,p){const bits=[];if(p.pass!=null&&p.fail!=null)bits.push(`${p.pass} verified · ${p.fail} failing${p.error!=null?` · ${p.error} error`:''}`);if(p.up!=null&&p.n!=null)bits.push(`${p.up} of ${p.n}`);if(p.bgp_idle!=null)bits.push(`idle BGP ${p.bgp_idle} · interfaces down ${p.down??0}`);return `${s.name} ${p.pct}% · ${ts(p.at)}<div class="fine">${esc(p.method||s.method||'')}${bits.length?' · '+esc(bits.join(' · ')):''}</div>`}
function showTrendPoint(s,p){drawer.innerHTML=`<span class="x" onclick="clearFocus()">✕</span><h2>${esc(s.name)} ${p.pct}%</h2><div class="fine">${ts(p.at)}</div><p>${esc(p.method||s.method||'')}</p>`+(p.pass!=null?`<div class="fine">${p.pass} verified · ${p.fail} failing${p.error!=null?` · ${p.error} error`:''}</div>`:'')+(p.up!=null?`<div class="fine">${p.up} of ${p.n} up</div>`:'')+(p.bgp_idle!=null?`<div class="fine">idle BGP ${p.bgp_idle} · interfaces not ready ${p.down??0}</div>`:'')+(s.name==='compliant'?'<div class="fine">This is tested posture: a canonical test counts as verified only when every executed row passed.</div>':'');drawer.classList.add('open')}
function drawTrend(){const series=[
{name:'compliant',color:'#f59e0b',method:'tested posture — verified tests / (verified + failing)',pts:(D.compliance.trend||{}).points||[]},
{name:'probes up',color:'#a3e635',method:'application probes answering / probes this visit',pts:((D.health.planes||{}).application)||[]},
{name:'exporters reporting',color:'#a78bfa',method:'NetFlow exporters reporting / exporters this visit',pts:((D.health.planes||{}).netflow)||[]},
{name:'iosxe clean',color:'#3b82f6',method:'IOS-XE visit is 100% only when idle BGP and down interfaces are both zero',pts:((D.health.planes||{}).iosxe)||[]}
].map(s=>({...s,pts:s.pts.filter(p=>p&&p.at&&p.pct!=null)}));
const used=series.filter(s=>s.pts.length);
const host=document.getElementById('trend');
if(!used.length){host.innerHTML='<div class="empty">no series on the boards</div>';return}
const times=used.flatMap(s=>s.pts.map(p=>Date.parse(p.at))).filter(t=>!Number.isNaN(t));
const t0=Math.min(...times),t1=Math.max(...times),span=(t1-t0)||1;
const W=1000,H=132,L=36,R=8,T=8,B=18;
const X=t=>L+(t-t0)/span*(W-L-R),Y=p=>T+(100-p)/100*(H-T-B);
window.__tp={used};
let svg=`<svg viewBox="0 0 ${W} ${H}">`;
[0,50,100].forEach(g=>{const y=Y(g);svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#1e293b"/><text x="2" y="${y+3}" fill="#64748b" font-size="10">${g}</text>`});
used.forEach((s,si)=>{const pts=s.pts.map(p=>[X(Date.parse(p.at)),Y(Number(p.pct)),p]);svg+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;pts.forEach((p,pi)=>{svg+=`<circle class="dot" data-s="${si}" data-i="${pi}" cx="${p[0]}" cy="${p[1]}" r="5" fill="${s.color}" stroke="#0b1220" stroke-width="1"/>`})});
((D.compliance.trend||{}).flips||[]).filter(f=>f.at).forEach(f=>{const t=Date.parse(f.at);if(Number.isNaN(t))return;const x=X(t),col=f.direction==='better'?'#22c55e':f.direction==='worse'?'#ef4444':'#94a3b8';svg+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="${col}" stroke-dasharray="2,3"><title>${esc(f.direction||'flip')} ${esc(f.test||'')} ${esc(f.device||'')} ${esc(f.at)}</title></line>`});
const ticks=[t0,t1];svg+=ticks.map(t=>`<text x="${X(t)}" y="${H-2}" fill="#64748b" font-size="10" text-anchor="${t===t0?'start':'end'}">${esc(new Date(t).toISOString().slice(0,10))}</text>`).join('');
svg+='</svg>';
host.innerHTML=`<div class="tleg">`+used.map(s=>`<span title="${esc(s.method)}"><i style="background:${s.color}"></i>${esc(s.name)} ${s.pts.length}</span>`).join('')+`</div>`+svg+`<div class="tcap">Hover a point for the visit. Click it for the formula and counts. Compliant is tested posture (verified tests ÷ tests that ran).</div><div id="ttip"></div>`;
const tip=document.getElementById('ttip');
host.querySelectorAll('circle.dot').forEach(el=>{el.addEventListener('mouseenter',ev=>{const s=used[+el.dataset.s],p=s.pts[+el.dataset.i];tip.innerHTML=pointDetail(s,p);tip.classList.add('on');const r=host.getBoundingClientRect();tip.style.left=Math.min(ev.clientX-r.left+8,r.width-280)+'px';tip.style.top='8px'});el.addEventListener('mouseleave',()=>tip.classList.remove('on'));el.addEventListener('click',ev=>{ev.stopPropagation();showTrendPoint(used[+el.dataset.s],used[+el.dataset.s].pts[+el.dataset.i])})})}
// ---- pan/zoom
const svg=document.getElementById('svg');let vb={x:0,y:0,w:W,h:H};function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}setVB();
svg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY>0?1.1:0.9;const r=svg.getBoundingClientRect();const px=vb.x+(e.clientX-r.left)/r.width*vb.w,py=vb.y+(e.clientY-r.top)/r.height*vb.h;vb={x:px-(px-vb.x)*k,y:py-(py-vb.y)*k,w:vb.w*k,h:vb.h*k};setVB()},{passive:false});
let drag=null;svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vb:{...vb}}});window.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x=drag.vb.x-(e.clientX-drag.x)*vb.w/r.width;vb.y=drag.vb.y-(e.clientY-drag.y)*vb.h/r.height;setVB()});window.addEventListener('mouseup',e=>{if(drag&&Math.abs(e.clientX-drag.x)<3&&Math.abs(e.clientY-drag.y)<3&&e.target.tagName==='svg')clearFocus();drag=null});
document.querySelectorAll('.tg[data-l]').forEach(t=>t.addEventListener('click',()=>{layers[t.dataset.l]=!layers[t.dataset.l];t.classList.toggle('on');render()}));
document.getElementById('trendTg').addEventListener('click',()=>{const on=document.getElementById('trend').classList.toggle('on');document.getElementById('trendTg').classList.toggle('on',on);if(on)drawTrend()});
document.getElementById('reset').addEventListener('click',()=>{vb={x:0,y:0,w:W,h:H};setVB();clearFocus()});
render();side();
</script></body></html>
